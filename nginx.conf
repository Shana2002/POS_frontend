# Serves the built SPA and proxies the API on the same origin, so the bundle can
# ship with VITE_API_BASE_URL=/api/v1 and never sees a CORS preflight.
server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The API already gzips nothing; static assets are the win here.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
    # No Content-Security-Policy on purpose: index.html applies the stored theme
    # from an inline <script> before React paints (to avoid a light flash), so a
    # strict policy needs a nonce or hash for it. Add one deliberately, not by
    # copying a default that silently breaks theming.

    # Vite emits content-hashed filenames under /assets, so these can be cached
    # for a year and never revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry document must not be cached, or a deploy keeps serving the old
    # bundle's <script> tags.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A PDF or XLSX export renders synchronously and can outlast the 60s
        # default; Gunicorn is configured with a 120s timeout, so allow more here.
        proxy_read_timeout 180s;

        # Exports are streamed as a blob and lib/download.ts reads the filename
        # out of Content-Disposition — do not buffer or rewrite the response.
        proxy_buffering off;
    }

    # React Router owns the path space: an unknown path is a client route, not a
    # 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
